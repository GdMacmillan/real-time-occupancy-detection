[flake8]
max-line-length = 110
extend-ignore = 
    # Ignore whitespace before ':' (Black handles this)
    E203,
    # Line break before binary operator (Black handles this)
    W503,
    # Missing docstring in public module
    D100,
    # Missing docstring in public class
    D101,
    # Missing docstring in public method
    D102,
    # Missing docstring in public function
    D103
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    notebooks

[isort]
profile = black
multi_line_output = 3
skip = notebooks
