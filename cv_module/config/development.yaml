# Development environment overrides
service:
  host: "localhost"
  port: 8765
  log_dir: "logs/dev"
  visualization:
    enabled: false

camera:
  # type: "realsense"
  params:
    resolution:
      width: 640
      height: 480
    fps: 30
    # RealSense specific settings
    # enable_infrared: false
    # align_depth: true
    # filters:
    #   decimation: 2
    #   spatial: true
    #   temporal: true
    #   hole_filling: true

detector:
  type: "yolo"
  model:
    name: "yolov8n.pt"
    confidence_threshold: 0.4
    verbose: true  # More verbose logging in development
    summary_interval: 30
    params:
      iou_threshold: 0.45
      max_det: 300

websocket:
  max_clients: 10
  message_queue_size: 100
  ping_interval: 30
  ping_timeout: 10 