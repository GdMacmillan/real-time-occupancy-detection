# Default configuration for CV module
service:
  host: "localhost"
  port: 8765
  log_dir: "logs"
  visualization:
    enabled: true
    window_name: "CV Module Debug View"
    draw_confidence: true
    draw_fps: true
    scale: 1.0  # Scale factor for display window

camera:
  type: "webcam"
  params:
    camera_id: 0
    resolution:
      width: 640
      height: 480
    fps: 30

detector:
  type: "yolo"
  model:
    name: "yolov8n.pt"
    confidence_threshold: 0.4
    verbose: false
    summary_interval: 30
    params:
      iou_threshold: 0.45
      max_det: 300

websocket:
  max_clients: 10
  message_queue_size: 100
  ping_interval: 30
  ping_timeout: 10 