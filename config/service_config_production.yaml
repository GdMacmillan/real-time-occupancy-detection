service:
  host: "0.0.0.0"  # Accept external connections
  port: 8765
  log_dir: "logs/prod"

camera:
  type: "realsense"  # Use RealSense in production
  params:
    resolution:
      width: 1280
      height: 720
    fps: 30

detector:
  type: "yolo"
  model:
    name: "yolov8m.pt"  # Use medium model for better accuracy
    confidence_threshold: 0.5
    params:
      iou_threshold: 0.45
      max_det: 300

websocket:
  max_clients: 50
  message_queue_size: 1000
  ping_interval: 30
  ping_timeout: 10
