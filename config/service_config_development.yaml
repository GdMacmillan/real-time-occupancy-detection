service:
  host: "localhost"
  port: 8765
  log_dir: "logs/dev"

camera:
  type: "realsense"
  params:
    # Webcam settings (commented for reference)
    # camera_id: 0
    resolution:
      width: 640
      height: 480
    fps: 30
    # RealSense specific settings
    enable_infrared: false  # Optional: enable IR stream
    align_depth: true      # Optional: align depth to color frame
    filters:              # Optional: post-processing filters
      decimation: 2       # Reduce depth frame density
      spatial: true       # Spatial noise reduction
      temporal: true      # Temporal noise reduction
      hole_filling: true  # Fill missing depth data

detector:
  type: "yolo"
  model:
    name: "yolov8n.pt"
    confidence_threshold: 0.4
    verbose: false  # Control YOLO's built-in logging
    summary_interval: 30  # Interval in seconds for summary logging
    params:
      iou_threshold: 0.45
      max_det: 300

websocket:
  max_clients: 10
  message_queue_size: 100
  ping_interval: 30
  ping_timeout: 10
