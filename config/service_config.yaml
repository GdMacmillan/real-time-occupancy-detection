# Service configuration
service:
  host: "localhost"
  port: 8765
  log_dir: "logs"

# Camera configuration
camera:
  type: "webcam"  # Options: "webcam", "realsense"
  params:
    camera_id: 0  # Only used for webcam
    # RealSense specific settings (if needed)
    resolution:
      width: 640
      height: 480
    fps: 30

# Detector configuration
detector:
  type: "yolo"  # Future-proofing for other detector types
  model:
    name: "yolov8n.pt"  # Options: yolov8n.pt, yolov8s.pt, yolov8m.pt, yolov8l.pt, yolov8x.pt
    confidence_threshold: 0.5
    # Additional model hyperparameters
    params:
      iou_threshold: 0.45
      max_det: 300

# WebSocket configuration
websocket:
  max_clients: 10
  message_queue_size: 100
  ping_interval: 30  # seconds
  ping_timeout: 10  # seconds
